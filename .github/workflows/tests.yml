name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: agent-lab demo --split dev --task-id task_dev_7_monthly
      # 此工作流不使用 API Key；不能把 CI 通过称为真实模型评测通过。

  container:
    name: Docker boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      # 官方镜像由 CI 的 Linux daemon 拉取；不需要用户的 Desktop 或 API Key。
      - run: docker pull python:3.12-slim
      - run: docker image inspect python:3.12-slim --format '{{.Id}}'
      - run: python -X utf8 -m unittest discover -s tests -p test_container.py -v
        env:
          AGENT_LAB_TEST_DOCKER: '1'
